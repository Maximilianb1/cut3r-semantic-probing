experiment: segmentation-cut3r-random

# Random-initialized CUT3R baseline. Its scientific meaning is an OPEN decision
# (see ../../src/backbones/README.md); the reset_parameters
# init below is a provisional placeholder pending a baseline ADR.
backbone:
  kind: cut3r
  weights: random
  options:
    cut3r_root: ${CUT3R_ROOT}
    checkpoint: ${CUT3R_ROOT}/src/cut3r_512_dpt_4_64.pth
    checkpoint_sha256: 45f7e98a0a64dbeb54901ae2b878cd8cd125f20a4497316483f0bd6f109f8103
    expected_commit: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
    compatibility_patch: curope-scalar-type-v1
    input_size: 512
    patch_size: 16
    square_ok: false
    device: cuda
    random_init:
      strategy: reset_parameters
      seed: 20260729

# Read by src/segmentation/configs/cut3r_random.yaml; must match it.
probe_cache:
  dir: ${CUT3R_CACHE_ROOT}/probe/cut3r-random

data:
  manifest_dir: ${CUT3R_ARTIFACT_ROOT}/manifests/full51-part-a-v1
  dataset_root: ${CO3D_ROOT}

extraction:
  layout: target_only
  device: cuda
  mask_threshold: 0.5
  windows_per_shard: 32
  inspect_files: false
  verify_source_hashes: true
  seed: 20260729
