dataset:
  version: CO3Dv2-v2_231130
  root: ${CO3D_ROOT}
  categories:
    [backpack, ball, bicycle, bottle, car, chair, hydrant, plant, toyplane, vase]
  expected_category_count: 10
  require_viewpoint: true
  require_local_files: true

sampling:
  seed: 20260718
  window_length: 6
  windows_per_sequence: 4
  sequence_caps:
    train: 50
    val: 10
    test: 10

preprocessing:
  input_size: 512
  patch_size: 16
  square_ok: false
  mask_threshold: 0.5

model:
  cut3r_root: ${CUT3R_ROOT}
  expected_commit: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
  compatibility_patch: curope-scalar-type-v1
  checkpoint: ${CUT3R_CHECKPOINT}
  checkpoint_sha256: 45f7e98a0a64dbeb54901ae2b878cd8cd125f20a4497316483f0bd6f109f8103
  device: cuda

cache:
  directory: ${CUT3R_CACHE_ROOT}/pilot
  windows_per_shard: 32

output:
  manifest_dir: ${CUT3R_ARTIFACT_ROOT}/manifests/pilot
