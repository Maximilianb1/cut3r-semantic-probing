dataset:
  version: CO3Dv2-v2_231130
  root: ${CO3D_ROOT}
  categories: [ball, chair]
  expected_category_count: 2
  require_viewpoint: true
  require_local_files: true

sampling:
  seed: 20260718
  window_length: 6
  windows_per_sequence: 3
  sequence_caps:
    train: 3
    val: 3
    test: 3

preprocessing:
  input_size: 512
  patch_size: 16
  square_ok: false
  mask_threshold: 0.5

model:
  cut3r_root: ${CUT3R_ROOT}
  expected_commit: 8bc15dc92a6d7fd92920b4ec81540d3dec7d3ecf
  compatibility_patch: curope-scalar-type-v1
  checkpoint: ${CUT3R_CHECKPOINT}
  device: cuda

cache:
  directory: ${CUT3R_CACHE_ROOT}/debug
  windows_per_shard: 8

output:
  manifest_dir: ${CUT3R_ARTIFACT_ROOT}/manifests/debug
