experiment: segmentation-dinov2-expanded-mlp
backbone: dinov2-vitb14

# Expanded training (docs/data/part-a-cache-layout.md "Safe Use"): same head/recipe
# as dinov2_partial_mlp.yaml, but train_dirs unions the original+leftover+
# cap100-new-train caches' train rows; val/test stay on `dir` alone for a comparable
# score. All three paths must exist first. Not smoke-testable via
# make_synthetic_probe_cache.py as-is (see tests/test_segmentation_dataset.py for
# that coverage instead). See dinov2_expanded_linear.yaml for the same data with a
# linear (hidden_dims: []) head instead.
#
# Advanced frozen baseline. The DINOv2 variant is an OPEN decision pending a
# baseline ADR; feature_dim 768 matches CUT3R so the head is comparable.
# Note its token grid is finer than CUT3R's (patch 14 vs 16), so IoU is measured
# on a different grid - see the cross-backbone comparison ADR.
probe_cache:
  dir: ${CUT3R_CACHE_ROOT}/probe/dinov2-vitb14
  train_dirs:
    - ${CUT3R_CACHE_ROOT}/probe/dinov2-vitb14
    - ${CUT3R_CACHE_ROOT}/probe/dinov2-vitb14-leftover
    - ${CUT3R_CACHE_ROOT}/probe/dinov2-vitb14-cap100-new-train

model:
  feature_dim: 768
  num_classes: 1
  # [] is a true linear probe; [512] is a 1-hidden-layer MLP probe.
  # Which one Stage 1 reports is an OPEN decision.
  hidden_dims: [512]
  activation: gelu
  dropout: 0.0

training:
  # adam | adamw | sgd (sgd also reads `momentum`)
  optimizer: adam
  epochs: 20
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0
  pos_weight: null
  seed: 20260729
  device: cpu
  # 8, not 0: 3x more windows makes single-threaded reads the bottleneck, not compute.
  # Doesn't change results (shuffle order is seed-fixed, no per-item randomness).
  num_workers: 8
  # tqdm bars; they draw only on a real terminal, never into a redirected log
  progress: true

splits:
  train: train
  val: val
  test: test

output:
  dir: src/segmentation/experiments/segmentation-dinov2-expanded-mlp
