experiment: segmentation-cut3r-trained-mlp
backbone: cut3r-trained

# cache_dirs pools the original+leftover+cap100-new-train caches (the full
# window union) for every split, relabeled by split_override_path's independent
# stratified split (scripts/derive_segmentation_split.py) rather than each
# cache's own recorded split. All three paths must exist first. Not
# smoke-testable via make_synthetic_probe_cache.py as-is (see
# tests/test_segmentation_dataset.py for that coverage instead). See
# cut3r_trained_linear.yaml for the same data with a linear (hidden_dims: [])
# head instead.
probe_cache:
  cache_dirs:
    - ${CUT3R_CACHE_ROOT}/probe/cut3r-trained
    - ${CUT3R_CACHE_ROOT}/probe/cut3r-trained-leftover
    - ${CUT3R_CACHE_ROOT}/probe/cut3r-trained-cap100-new-train
  split_override_path: configs/segmentation_split_override.json

model:
  feature_dim: 768
  num_classes: 1
  # [] is a true linear probe; [512] is a 1-hidden-layer MLP probe. Both are
  # run and reported; see reports/segmentation/cut3r-trained-linear/ and
  # reports/segmentation/cut3r-trained-mlp/.
  hidden_dims: [512]
  activation: gelu
  dropout: 0.0

training:
  # adam | adamw | sgd (sgd also reads `momentum`)
  optimizer: adam
  epochs: 20
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  pos_weight: null
  seed: 20260729
  device: cpu
  # 8, not 0: 3x more windows makes single-threaded reads the bottleneck, not compute.
  # Doesn't change results (shuffle order is seed-fixed, no per-item randomness).
  num_workers: 8
  # tqdm bars; they draw only on a real terminal, never into a redirected log
  progress: true

splits:
  train: train
  val: val
  test: test

output:
  dir: src/segmentation/experiments/segmentation-cut3r-trained-mlp
