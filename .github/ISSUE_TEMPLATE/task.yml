name: Task
description: A bounded implementation, documentation, or research task
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the concrete result, not just an activity.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant phase, files, decisions, or dependencies.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Observable result
        - [ ] Required check
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
  - type: input
    id: owner
    attributes:
      label: Proposed owner
