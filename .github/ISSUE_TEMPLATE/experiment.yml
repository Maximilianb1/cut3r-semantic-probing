name: Experiment
description: Propose a reproducible training or evaluation run
title: "[Experiment] "
labels: ["experiment"]
body:
  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis
    validations:
      required: true
  - type: textarea
    id: variables
    attributes:
      label: Comparison and controlled variables
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Dataset and split
      description: Include manifest/version and leakage checks.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Metrics and success criteria
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Expected resources and artifacts
