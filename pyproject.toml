[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cut3r-semantic-probing"
version = "0.1.0"
description = "Reproducible CO3Dv2 preprocessing and frozen CUT3R feature extraction"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.4",
  "omegaconf==2.3.1",
  "Pillow>=10,<12",
  "pyarrow>=16,<21",
  "PyYAML>=6,<7",
  "remotezip==0.12.3",
  "requests>=2.32,<3",
  "safetensors>=0.4,<1",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
