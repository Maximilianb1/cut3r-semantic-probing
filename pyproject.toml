[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cut3r-semantic-probing"
version = "0.1.0"
description = "Semantic probing of frozen CUT3R representations on CO3D"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Ron Bartal"},
  {name = "Yam Ben-Tov"},
  {name = "Maximilian Bershtman"},
  {name = "Lihi Bar-Tal"},
  {name = "Aviv Rabi"},
  {name = "Jeremy Jornet"},
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy==1.26.4",
  "omegaconf==2.3.1",
  "Pillow>=10,<12",
  "pyarrow>=16,<21",
  "PyYAML>=6,<7",
  "remotezip==0.12.3",
  "requests>=2.32,<3",
  "safetensors>=0.4,<1",
  "torch>=2.6,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
